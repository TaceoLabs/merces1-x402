name: Rust Tests

on:
    push:
        branches:
            - main
        tags-ignore:
            - v*
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    # incremental builds are slower and don't make much sense in ci
    CARGO_INCREMENTAL: 0
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: full
    FOUNDRY_PROFILE: ci

jobs:
    test:
        name: Test
        runs-on: [ubuntu-latest]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  submodules: recursive
            - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
              with:
                  toolchain: stable
            # disable rust cache for now, as it does not help on the self-hosted runners
            # - uses: Swatinem/rust-cache@v2
            - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
            - name: Unit & Integration Tests
              run: cargo test --workspace --all-features --profile ci-dev
