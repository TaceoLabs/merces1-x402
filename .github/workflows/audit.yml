name: "Audit Dependencies"
on:
    push:
        paths:
            # Run if workflow changes
            - ".github/workflows/audit.yml"
            # Run on changed dependencies
            - "**/Cargo.toml"
            - "**/Cargo.lock"
            # Run if the configuration file changes
            - "**/audit.toml"
    # Rerun periodically to pick up new advisories
    pull_request:
    schedule:
        - cron: "0 0 * * *"

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions: read-all

jobs:
    cargo-deny:
        runs-on: [ubuntu-latest]
        strategy:
            matrix:
                checks:
                    - advisories
                    - bans sources
                    # - bans licenses sources TODO add licenses again

        # Prevent sudden announcement of a new advisory from failing ci:
        continue-on-error: ${{ matrix.checks == 'advisories' }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  submodules: recursive
            - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
              with:
                  toolchain: stable
            - uses: taiki-e/install-action@1215446185352662cec6825af8e979af4006a502 # cargo-deny
            - name: Run cargo-deny
              run: cargo deny --log-level error --all-features check ${{ matrix.checks }}
